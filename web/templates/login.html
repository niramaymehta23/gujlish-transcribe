<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gujarati Transcriber · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Gujarati Transcriber home"><span class="brand-mark" lang="gu">અ</span>Gujarati Transcriber</a></header>
<main class="login">
  <form method="post" class="login-form">
    <h1>Sign in</h1>
    <p>Enter the password you were given to use this transcriber.</p>
    <label class="field-label" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <button class="primary" type="submit">Continue</button>
  </form>
</main>
</body>
</html>
