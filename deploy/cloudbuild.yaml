# Builds the image on Google Cloud (no local Docker needed). Run through deploy/deploy.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["HF_TOKEN"]
    args:
      - -c
      - |
        printf '%s' "$$HF_TOKEN" > /tmp/hf_token
        docker build --secret id=hf_token,src=/tmp/hf_token --build-arg MODELS=${_MODELS} -t ${_IMAGE} .
        status=$$?
        rm -f /tmp/hf_token
        exit $$status
images: ["${_IMAGE}"]
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/gujlish-hf-token/versions/latest
      env: HF_TOKEN
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
